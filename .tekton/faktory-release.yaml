apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: faktory-release
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: 'event == "push" && target_branch.matches("^refs/tags/v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")'
    pipelinesascode.tekton.dev/max-keep-runs: "10"
spec:
  taskRunSpecs:
    - pipelineTaskName: verify-amd64
      podTemplate:
        nodeSelector:
          kubernetes.io/arch: amd64
    - pipelineTaskName: verify-arm64
      podTemplate:
        nodeSelector:
          kubernetes.io/arch: arm64
        tolerations:
          - key: workload-type
            operator: Equal
            value: gpu-inference
            effect: NoSchedule
    - pipelineTaskName: verify-visual-renderer-amd64
      podTemplate:
        nodeSelector:
          kubernetes.io/arch: amd64
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          fsGroup: 65532
          seccompProfile:
            type: Unconfined
        volumes:
          - name: tmp
            emptyDir:
              medium: Memory
              sizeLimit: 256Mi
    - pipelineTaskName: deploy-production
      podTemplate:
        nodeSelector:
          kubernetes.io/arch: amd64
  timeouts:
    pipeline: 2h0m0s
  params:
    - name: repo-url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: source-branch
      value: "{{ source_branch }}"
    - name: base-image
      value: "{{ CONTAINER_REGISTRY }}/{{ repo_owner }}/faktory"
    - name: visual-renderer-base-image
      value: "{{ CONTAINER_REGISTRY }}/{{ repo_owner }}/faktory-visual-renderer"
  pipelineSpec:
    params:
      - { name: repo-url, type: string }
      - { name: revision, type: string }
      - { name: source-branch, type: string }
      - { name: base-image, type: string }
      - { name: visual-renderer-base-image, type: string }
    workspaces:
      - name: source
    tasks:
      - name: fetch-repository
        retries: 1
        taskSpec:
          params:
            - { name: repo-url, type: string }
            - { name: revision, type: string }
          workspaces:
            - name: output
          volumes:
            - name: git-auth
              secret:
                secretName: "{{ git_auth_secret }}"
          steps:
            - name: clone
              image: docker.io/alpine/git:2.49.1@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26
              workingDir: $(workspaces.output.path)
              volumeMounts:
                - { name: git-auth, mountPath: /etc/git-auth, readOnly: true }
              script: |
                #!/bin/sh
                set -eu
                cp /etc/git-auth/.gitconfig /root/.gitconfig
                cp /etc/git-auth/.git-credentials /root/.git-credentials
                git clone "$(params.repo-url)" .
                git checkout --detach "$(params.revision)"
                test "$(git rev-parse HEAD)" = "$(params.revision)"
        params:
          - { name: repo-url, value: $(params.repo-url) }
          - { name: revision, value: $(params.revision) }
        workspaces:
          - { name: output, workspace: source }

      - name: validate-release
        runAfter: [fetch-repository]
        taskSpec:
          params:
            - { name: revision, type: string }
            - { name: source-branch, type: string }
          results:
            - { name: tag, type: string }
          workspaces:
            - name: source
          volumes:
            - name: trusted-signers
              secret:
                secretName: faktory-release-trusted-signers
          steps:
            - name: policy
              image: docker.io/alpine/git:2.49.1@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26
              workingDir: $(workspaces.source.path)
              env:
                - { name: SOURCE_BRANCH, value: $(params.source-branch) }
              volumeMounts:
                - { name: trusted-signers, mountPath: /etc/release-signers, readOnly: true }
              script: |
                #!/bin/sh
                set -eu

                fail() {
                  printf '%s\n' "$1" >&2
                  exit 1
                }

                case "$SOURCE_BRANCH" in refs/tags/v*) tag="${SOURCE_BRANCH#refs/tags/}" ;; *) fail 'source branch is not a release tag ref' ;; esac
                printf '%s\n' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || fail 'tag is not an exact stable semantic version'
                printf '%s\n' "$(params.revision)" | grep -Eq '^[0-9a-f]{40}$' || fail 'revision is not a full commit SHA'
                test "$(git cat-file -t "refs/tags/$tag")" = tag || fail 'release tag is not annotated'

                export GNUPGHOME=/tmp/release-gnupg
                install -d -m 700 "$GNUPGHOME"
                gpg --batch --no-autostart --import /etc/release-signers/signing-key.asc
                git verify-tag "$tag"
                test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$(params.revision)" || fail 'tag does not resolve to the webhook revision'
                git merge-base --is-ancestor "$(params.revision)" refs/remotes/origin/main || fail 'release revision is not reachable from origin/main'

                version="${tag#v}"
                cargo_matches="$(grep -Ec '^version = "[^"]+"$' Cargo.toml)"
                test "$cargo_matches" -eq 1 || fail 'Cargo workspace version is missing or ambiguous'
                cargo_version="$(awk '$0 == "[workspace.package]" { workspace = 1; next } workspace && /^\[/ { exit } workspace && /^version = "/ { gsub(/^version = "|"$/, ""); print; exit }' Cargo.toml)"
                web_matches="$(grep -Ec '^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"[^"]+"' web/package.json)"
                test "$web_matches" -eq 1 || fail 'web package version is missing or ambiguous'
                web_version="$(awk -F'"' '/^[[:space:]]*"version"[[:space:]]*:/ { print $4; exit }' web/package.json)"
                test "$version" = "$cargo_version" || fail 'tag does not match the Cargo workspace version'
                test "$version" = "$web_version" || fail 'tag does not match the web package version'
                printf '%s' "$tag" > "$(results.tag.path)"
        params:
          - { name: revision, value: $(params.revision) }
          - { name: source-branch, value: $(params.source-branch) }
        workspaces:
          - { name: source, workspace: source }

      - name: scan-private-material
        runAfter: [fetch-repository]
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: scan
              image: docker.io/zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
              workingDir: $(workspaces.source.path)
              script: |
                #!/bin/sh
                set -eu
                gitleaks dir --config .gitleaks.toml --redact --no-banner --exit-code 1 .
        workspaces:
          - { name: source, workspace: source }

      - name: build-amd64
        runAfter: [validate-release, scan-private-material]
        retries: 1
        taskSpec:
          params:
            - { name: image, type: string }
            - { name: revision, type: string }
            - { name: buildkit-addr, type: string }
          workspaces:
            - name: source
          volumes:
            - name: git-auth
              secret:
                secretName: "{{ git_auth_secret }}"
          steps:
            - name: build
              image: docker.io/moby/buildkit:v0.26.3@sha256:5601811fde88bb9e8a577bfe804af82bccb712e1cd07ff94663bded5e628cf75
              workingDir: $(workspaces.source.path)
              volumeMounts:
                - { name: git-auth, mountPath: /etc/git-auth, readOnly: true }
              script: |
                #!/bin/sh
                set -eu
                buildctl --addr "tcp://$(params.buildkit-addr)" build \
                  --frontend dockerfile.v0 --local context=. --local dockerfile=. \
                  --opt filename=Dockerfile --opt target=runtime --opt platform=linux/amd64 \
                  --opt "build-arg:REVISION=$(params.revision)" \
                  --secret id=gitconfig,src=/etc/git-auth/.gitconfig \
                  --secret id=git-credentials,src=/etc/git-auth/.git-credentials \
                  --output "type=image,name=$(params.image),push=true"
        params:
          - { name: image, value: "$(params.base-image):sha-$(params.revision)-amd64" }
          - { name: revision, value: $(params.revision) }
          - { name: buildkit-addr, value: "{{ BUILDKIT_AMD64_ADDR }}" }
        workspaces:
          - { name: source, workspace: source }

      - name: build-arm64
        runAfter: [validate-release, scan-private-material]
        retries: 1
        taskSpec:
          params:
            - { name: image, type: string }
            - { name: revision, type: string }
            - { name: buildkit-addr, type: string }
          workspaces:
            - name: source
          volumes:
            - name: git-auth
              secret:
                secretName: "{{ git_auth_secret }}"
          steps:
            - name: build
              image: docker.io/moby/buildkit:v0.26.3@sha256:5601811fde88bb9e8a577bfe804af82bccb712e1cd07ff94663bded5e628cf75
              workingDir: $(workspaces.source.path)
              volumeMounts:
                - { name: git-auth, mountPath: /etc/git-auth, readOnly: true }
              script: |
                #!/bin/sh
                set -eu
                buildctl --addr "tcp://$(params.buildkit-addr)" build \
                  --frontend dockerfile.v0 --local context=. --local dockerfile=. \
                  --opt filename=Dockerfile --opt target=runtime --opt platform=linux/arm64 \
                  --opt "build-arg:REVISION=$(params.revision)" \
                  --secret id=gitconfig,src=/etc/git-auth/.gitconfig \
                  --secret id=git-credentials,src=/etc/git-auth/.git-credentials \
                  --output "type=image,name=$(params.image),push=true"
        params:
          - { name: image, value: "$(params.base-image):sha-$(params.revision)-arm64" }
          - { name: revision, value: $(params.revision) }
          - { name: buildkit-addr, value: "{{ BUILDKIT_ARM64_ADDR }}" }
        workspaces:
          - { name: source, workspace: source }

      - name: build-visual-renderer-amd64
        runAfter: [validate-release, scan-private-material]
        retries: 1
        taskSpec:
          params:
            - { name: image, type: string }
            - { name: revision, type: string }
            - { name: buildkit-addr, type: string }
          workspaces:
            - name: source
          volumes:
            - name: git-auth
              secret:
                secretName: "{{ git_auth_secret }}"
          steps:
            - name: build
              image: docker.io/moby/buildkit:v0.26.3@sha256:5601811fde88bb9e8a577bfe804af82bccb712e1cd07ff94663bded5e628cf75
              workingDir: $(workspaces.source.path)
              volumeMounts:
                - { name: git-auth, mountPath: /etc/git-auth, readOnly: true }
              script: |
                #!/bin/sh
                set -eu
                buildctl --addr "tcp://$(params.buildkit-addr)" build \
                  --frontend dockerfile.v0 --local context=. --local dockerfile=. \
                  --opt filename=Dockerfile --opt target=visual-renderer-runtime --opt platform=linux/amd64 \
                  --opt "build-arg:REVISION=$(params.revision)" \
                  --secret id=gitconfig,src=/etc/git-auth/.gitconfig \
                  --secret id=git-credentials,src=/etc/git-auth/.git-credentials \
                  --output "type=image,name=$(params.image),push=true"
        params:
          - { name: image, value: "$(params.visual-renderer-base-image):sha-$(params.revision)-amd64" }
          - { name: revision, value: $(params.revision) }
          - { name: buildkit-addr, value: "{{ BUILDKIT_AMD64_ADDR }}" }
        workspaces:
          - { name: source, workspace: source }

      - name: verify-amd64
        runAfter: [build-amd64]
        taskSpec:
          params:
            - { name: image, type: string }
          steps:
            - name: render
              image: $(params.image)
              imagePullPolicy: Always
              script: |
                #!/bin/sh
                set -eu
                output_dir="$(mktemp -d /tmp/faktory-render-XXXXXX)"
                trap 'rm -rf "$output_dir"' EXIT
                project_root="$output_dir/project"
                library_root="$output_dir/libraries"
                mkdir "$project_root" "$library_root"
                cat > "$project_root/main.py" <<'PY'
                import cadquery as cq
                from faktory_design.v1 import Design, Output

                result = Design((
                    Output("primary", "assembly", cq.Assembly(cq.Workplane("XY").box(2, 2, 2)), primary=True),
                    Output("secondary", "part", cq.Workplane("XY").cylinder(1, 2)),
                ))
                PY
                /opt/faktory/env/bin/python -m renderer \
                  "$project_root" \
                  main.py \
                  "$library_root" \
                  "$output_dir/bundle"
                /opt/faktory/env/bin/python -c '
                import json
                import struct
                import sys
                from pathlib import Path

                bundle = Path(sys.argv[1])
                manifest = json.loads((bundle / "outputs.json").read_text())
                expected = [("primary", "assembly", True), ("secondary", "part", False)]
                actual = [(item["output_id"], item["role"], item["primary"]) for item in manifest["outputs"]]
                if manifest["format"] != "faktory-outputs-v1" or actual != expected:
                    raise SystemExit("invalid multipart output manifest")
                for output_id, _, _ in expected:
                    root = bundle / "outputs" / output_id
                    required = [root / "model.glb", root / "preview.svg", root / "facts.json"]
                    required.extend(root / "projections" / f"{name}.svg" for name in ("isometric", "front", "back", "left", "right", "top", "bottom"))
                    if not all(path.is_file() for path in required):
                        raise SystemExit("multipart worker artifacts are incomplete")
                    content = (root / "model.glb").read_bytes()
                    if len(content) < 12:
                        raise SystemExit("GLB header is truncated")
                    magic, version, declared_size = struct.unpack("<4sII", content[:12])
                    if magic != b"glTF" or version != 2 or declared_size != len(content):
                        raise SystemExit("invalid GLB framing")
                if list(bundle.rglob("*.png")) or any(path.name == "renders" for path in bundle.rglob("*")):
                    raise SystemExit("Python worker produced server-owned shaded artifacts")
                ' "$output_dir/bundle"
        params:
          - { name: image, value: "$(params.base-image):sha-$(params.revision)-amd64" }

      - name: verify-arm64
        runAfter: [build-arm64]
        taskSpec:
          params:
            - { name: image, type: string }
          steps:
            - name: render
              image: $(params.image)
              imagePullPolicy: Always
              script: |
                #!/bin/sh
                set -eu
                output_dir="$(mktemp -d /tmp/faktory-render-XXXXXX)"
                trap 'rm -rf "$output_dir"' EXIT
                project_root="$output_dir/project"
                library_root="$output_dir/libraries"
                mkdir "$project_root" "$library_root"
                cat > "$project_root/main.py" <<'PY'
                import cadquery as cq
                from faktory_design.v1 import Design, Output

                result = Design((
                    Output("primary", "assembly", cq.Assembly(cq.Workplane("XY").box(2, 2, 2)), primary=True),
                    Output("secondary", "part", cq.Workplane("XY").cylinder(1, 2)),
                ))
                PY
                /opt/faktory/env/bin/python -m renderer \
                  "$project_root" \
                  main.py \
                  "$library_root" \
                  "$output_dir/bundle"
                /opt/faktory/env/bin/python -c '
                import json
                import struct
                import sys
                from pathlib import Path

                bundle = Path(sys.argv[1])
                manifest = json.loads((bundle / "outputs.json").read_text())
                expected = [("primary", "assembly", True), ("secondary", "part", False)]
                actual = [(item["output_id"], item["role"], item["primary"]) for item in manifest["outputs"]]
                if manifest["format"] != "faktory-outputs-v1" or actual != expected:
                    raise SystemExit("invalid multipart output manifest")
                for output_id, _, _ in expected:
                    root = bundle / "outputs" / output_id
                    required = [root / "model.glb", root / "preview.svg", root / "facts.json"]
                    required.extend(root / "projections" / f"{name}.svg" for name in ("isometric", "front", "back", "left", "right", "top", "bottom"))
                    if not all(path.is_file() for path in required):
                        raise SystemExit("multipart worker artifacts are incomplete")
                    content = (root / "model.glb").read_bytes()
                    if len(content) < 12:
                        raise SystemExit("GLB header is truncated")
                    magic, version, declared_size = struct.unpack("<4sII", content[:12])
                    if magic != b"glTF" or version != 2 or declared_size != len(content):
                        raise SystemExit("invalid GLB framing")
                if list(bundle.rglob("*.png")) or any(path.name == "renders" for path in bundle.rglob("*")):
                    raise SystemExit("Python worker produced server-owned shaded artifacts")
                ' "$output_dir/bundle"
        params:
          - { name: image, value: "$(params.base-image):sha-$(params.revision)-arm64" }

      - name: verify-visual-renderer-amd64
        runAfter: [build-visual-renderer-amd64]
        taskSpec:
          params:
            - { name: image, type: string }
          workspaces:
            - name: source
          steps:
            - name: render-seven-images
              image: $(params.image)
              imagePullPolicy: Always
              workingDir: /opt/visual-renderer
              env:
                - { name: HOME, value: /tmp }
                - { name: TMPDIR, value: /tmp }
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: Unconfined }
              computeResources:
                requests: { cpu: 250m, memory: 512Mi }
                limits: { cpu: "1", memory: 1Gi }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
              script: |
                #!/bin/sh
                set -eu
                node /opt/visual-renderer/dist/index.js &
                server_pid=$!
                trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
                node "$(workspaces.source.path)/.tekton/verify-visual-renderer.mjs"
        params:
          - { name: image, value: "$(params.visual-renderer-base-image):sha-$(params.revision)-amd64" }
        workspaces:
          - { name: source, workspace: source }

      - name: publish-manifest
        runAfter: [verify-amd64, verify-arm64]
        retries: 1
        taskSpec:
          params:
            - { name: base-image, type: string }
            - { name: revision, type: string }
          steps:
            - name: publish-and-verify
              image: gcr.io/go-containerregistry/crane:debug@sha256:54b27703e6c602fbd6f95712910e9c8d45d4361a59274bde38aeec943734e424
              script: |
                #!/busybox/sh
                set -eu
                base="$(params.base-image):sha-$(params.revision)"
                for arch in amd64 arm64; do
                  image="${base}-${arch}"
                  digest="$(crane digest "$image")"
                  printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
                  config="$(crane config "$(params.base-image)@$digest")"
                  printf '%s' "$config" | grep -Fq '"User":"65532:65532"'
                  printf '%s' "$config" | grep -Fq '"org.opencontainers.image.revision":"$(params.revision)"'
                done
                crane index append \
                  --manifest "${base}-amd64" \
                  --manifest "${base}-arm64" \
                  --tag "$base"
                manifest="$(crane manifest "$base")"
                printf '%s' "$manifest" | grep -Eq '"architecture"[[:space:]]*:[[:space:]]*"amd64"'
                printf '%s' "$manifest" | grep -Eq '"architecture"[[:space:]]*:[[:space:]]*"arm64"'
                digest="$(crane digest "$base")"
                printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
        params:
          - { name: base-image, value: $(params.base-image) }
          - { name: revision, value: $(params.revision) }

      - name: promote-release
        runAfter: [publish-manifest]
        retries: 1
        taskSpec:
          params:
            - { name: base-image, type: string }
            - { name: source-tag, type: string }
            - { name: release-tag, type: string }
          results:
            - { name: image, type: string }
          steps:
            - name: promote-and-verify
              image: gcr.io/go-containerregistry/crane:debug@sha256:54b27703e6c602fbd6f95712910e9c8d45d4361a59274bde38aeec943734e424
              script: |
                #!/busybox/sh
                set -eu
                source="$(params.base-image):$(params.source-tag)"
                digest="$(crane digest "$source")"
                printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
                immutable="$(params.base-image)@$digest"
                release="$(params.base-image):$(params.release-tag)"
                if existing="$(crane digest "$release" 2>/dev/null)"; then
                  test "$existing" = "$digest"
                else
                  crane copy "$immutable" "$release"
                fi
                test "$(crane digest "$release")" = "$digest"
                printf '%s' "$immutable" > "$(results.image.path)"
        params:
          - { name: base-image, value: $(params.base-image) }
          - { name: source-tag, value: sha-$(params.revision) }
          - { name: release-tag, value: $(tasks.validate-release.results.tag) }

      - name: promote-visual-renderer-release
        runAfter: [verify-visual-renderer-amd64]
        retries: 1
        taskSpec:
          params:
            - { name: base-image, type: string }
            - { name: source-tag, type: string }
            - { name: release-tag, type: string }
            - { name: revision, type: string }
          results:
            - { name: image, type: string }
          steps:
            - name: promote-and-verify
              image: gcr.io/go-containerregistry/crane:debug@sha256:54b27703e6c602fbd6f95712910e9c8d45d4361a59274bde38aeec943734e424
              script: |
                #!/busybox/sh
                set -eu
                source="$(params.base-image):$(params.source-tag)"
                digest="$(crane digest "$source")"
                printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
                immutable="$(params.base-image)@$digest"
                config="$(crane config "$immutable")"
                printf '%s' "$config" | grep -Fq '"User":"65532:65532"'
                printf '%s' "$config" | grep -Fq '"org.opencontainers.image.revision":"$(params.revision)"'
                release="$(params.base-image):$(params.release-tag)"
                if existing="$(crane digest "$release" 2>/dev/null)"; then
                  test "$existing" = "$digest"
                else
                  crane copy "$immutable" "$release"
                fi
                test "$(crane digest "$release")" = "$digest"
                printf '%s' "$immutable" > "$(results.image.path)"
        params:
          - { name: base-image, value: $(params.visual-renderer-base-image) }
          - { name: source-tag, value: sha-$(params.revision)-amd64 }
          - { name: release-tag, value: $(tasks.validate-release.results.tag) }
          - { name: revision, value: $(params.revision) }

      - name: deploy-production
        runAfter: [promote-release, promote-visual-renderer-release]
        retries: 1
        taskSpec:
          params:
            - { name: image, type: string }
            - { name: visual-renderer-image, type: string }
          workspaces:
            - name: source
          volumes:
            - name: kubeconfig
              secret:
                secretName: tekton-cluster-kubeconfig
          steps:
            - name: preview-and-up
              image: cr.holdenitdown.net/rfhold/general-ci@sha256:6943f91d774980357b24730a14ac4b026325d50962df4b2e15e24c3f43190e5b
              workingDir: $(workspaces.source.path)/infra/pulumi
              env:
                - { name: KUBECONFIG, value: /etc/kubeconfig/kubeconfig }
                - { name: PULUMI_HOME, value: /tmp/pulumi-home }
              envFrom:
                - secretRef: { name: pulumi-credentials }
                - secretRef: { name: authentik-credentials }
              volumeMounts:
                - { name: kubeconfig, mountPath: /etc/kubeconfig, readOnly: true }
              script: |
                #!/bin/sh
                set -eu
                test "`bun --version`" = "1.3.5"
                test "`pulumi version`" = "v3.253.0"
                bun install --frozen-lockfile
                pulumi preview --stack prod --diff --config "image=$(params.image)" --config "visualRendererImage=$(params.visual-renderer-image)"
                pulumi up --stack prod --yes --skip-preview --config "image=$(params.image)" --config "visualRendererImage=$(params.visual-renderer-image)"
        params:
          - { name: image, value: $(tasks.promote-release.results.image) }
          - { name: visual-renderer-image, value: $(tasks.promote-visual-renderer-release.results.image) }
        workspaces:
          - { name: source, workspace: source }
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteMany]
          storageClassName: shared-fs
          resources:
            requests:
              storage: 20Gi
